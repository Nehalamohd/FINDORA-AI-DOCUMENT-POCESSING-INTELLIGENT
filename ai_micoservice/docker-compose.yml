version: '3.8'

services:
  db:
    image: postgres:15
    container_name: findora_db
    environment:
      POSTGRES_USER: findora
      POSTGRES_PASSWORD: findorapass
      POSTGRES_DB: findora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: findora_redis
    ports:
      - "6379:6379"

  ai_service:
    build: .
    container_name: findora_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    container_name: findora_worker
    command: celery -A app.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
